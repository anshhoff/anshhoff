x2="0" y2="40" stroke="#27272a"/><text x="26" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="46" font-weight="750" fill="#a3e635" text-anchor="start" letter-spacing="-1.5" >16</text><text x="26" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0" >tools in a WhatsApp</text><text x="26" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0" >booking agent</text></g></g><g transform="translate(930,102)"><g class="up" style="animation-delay:0.60s"><line x1="0" y1="-48" x2="0" y2="40" stroke="#27272a"/><text x="26" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="46" font-weight="750" fill="#a3e635" text-anchor="start" letter-spacing="-1.5" >296</text><text x="26" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0" >test cases across</text><text x="26" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0" >voice + chat agents</text></g></g>
