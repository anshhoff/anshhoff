<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="CanApply: Job search that only shows jobs you can actually get. An LLM reads hard requirements out of each posting; plain code decides if you qualify. Runs as a Telegram agent.">
<title>CanApply</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="2" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<style>.st{opacity:0;animation:in .7s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.bar{animation:sweep 6s ease-in-out infinite}@keyframes sweep{0%,100%{opacity:.55}50%{opacity:1}}</style></defs>
<rect x=".5" y=".5" width="599" height="299" rx="16" fill="#161b22" stroke="#30363d"/>
<rect class="bar" x="1" y="1" width="598" height="4" rx="2" fill="url(#g)"/>
<text x="32" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">CanApply</text>
<text x="32" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#a78bfa">github.com/anshhoff/canapply</text>
