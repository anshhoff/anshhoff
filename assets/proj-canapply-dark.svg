onsolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">Postgres</text><rect x="184" y="250" width="75" height="26" rx="13" fill="#1f2630" stroke="#30363d"/><text x="221" y="268" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">pgvector</text><rect x="267" y="250" width="75" height="26" rx="13" fill="#1f2630" stroke="#30363d"/><text x="304" y="268" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#e6edf3">Telegram</text>
