<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Pixel Agents: Extended an open-source VS Code extension with an authenticated relay that streams AI-agent events from remote machines onto one shared board.">
