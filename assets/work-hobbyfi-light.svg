<rect x=".5" y=".5" width="1199" height="289" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect class="bar" x="1" y="1" width="1198" height="4" rx="2" fill="url(#g)"/>
<text x="32" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2328">HobbyFi</text>
<text x="32" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#7c3aed">AI / Full-Stack Intern · Mar 2026 – now</text>
<rect x="1049.2" y="31" width="118.8" height="26" rx="13" fill="none" stroke="#d0d7de"/><text x="1108.6" y="49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#59636e">in production</text><text x="32" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Co-built a WhatsApp AI receptionist that books, reschedules and takes UPI payments for venues, and own latency and</text><text x="32" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">call reliability on its Hindi–English voice agent (LiveKit + Gemini Live).</text><g class="st" style="animation-delay:0.3s"><text x="32" y="174" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#1f2328"><tspan fill="#1a7f37">▸ </tspan>16 tools · Qdrant RAG · consent gate before every write</text></g><g class="st" style="animation-delay:0.5s"><text x="32" y="200" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#1f2328"><tspan fill="#1a7f37">▸ </tspan>silent caller released in ~1 s (was 5–9 s); dead model session ends in ~1 s (was ~28 s)</text></g><g class="st" style="animation-delay:0.7s"><text x="32" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#1f2328"><tspan fill="#1a7f37">▸ </tspan>296 Vitest cases across both agents</text></g><rect x="32" y="240" width="90" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="77" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">TypeScript</text><rect x="130" y="240" width="60" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="160" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">Mastra</text><rect x="198" y="240" width="97" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="247" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">Gemini Live</text><rect x="304" y="240" width="68" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="338" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">LiveKit</text><rect x="380" y="240" width="60" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="410" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">Qdrant</text><rect x="448" y="240" width="60" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="478" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">Vitest</text>
