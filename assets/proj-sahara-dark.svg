<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Sahara: Agent that recovers failed payments.">
<title>Sahara: Agent that recovers failed payments.</title>
<defs>
<radialGradient id="gl"><stop offset="0" stop-color="#a3e635" stop-opacity="0.16"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#27272a" fill-opacity="0.5"/></pattern>
<clipPath id="r"><rect width="600" height="250" rx="18"/></clipPath>
<style>
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.glow{animation:drift 10s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,20px)}}
</style></defs>
<g clip-path="url(#r)">
<rect width="600" height="250" fill="#0f0f12"/>
<rect width="600" height="250" fill="url(#grid)"/>
<g class="glow"><circle cx="600" cy="250" r="270" fill="url(#gl)"/></g>
</g>
<rect x=".5" y=".5" width="599" height="249" rx="18" fill="none" stroke="#27272a"/>
<g transform="translate(36,60)"><g class="up" style="animation-delay:0.05s"><text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="24" font-weight="750" fill="#fafafa" text-anchor="start" letter-spacing="-0.4" >Sahara</text></g></g><g transform="translate(468.3,41)"><g class="up" style="animation-delay:0.10s"><rect x="0" y="0" width="96" height="26" rx="13" fill="none" stroke="#27272a" stroke-opacity="1"/><text x="15" y="17.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0" >hackathon</text></g></g><g transform="translate(36,90)"><g class="up" style="animation-delay:0.15s"><text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0" >Agent that recovers failed payments.</text></g></g><g transform="translate(36,162)"><g class="up" style="animation-delay:0.30s"><text x="-2" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="44" font-weight="750" fill="#a3e635" text-anchor="start" letter-spacing="-1.4" >69.2%</text></g></g><g transform="translate(36,190)"><g class="up" style="animation-delay:0.40s"><text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#fafafa" text-anchor="start" letter-spacing="0" >recovered vs 19.4% control (synthetic test)</text></g></g><g transform="translate(36,222)"><g class="up" style="animation-delay:0.50s"><text x="0" y="0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#52525b" text-anchor="start" letter-spacing="0.3" >python · fastapi · groq · 241 tests</text></g></g>
</svg>