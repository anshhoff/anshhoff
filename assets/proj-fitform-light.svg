268" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">Vision</text><rect x="237" y="250" width="105" height="26" rx="13" fill="#eaeef2" stroke="#d0d7de"/><text x="290" y="268" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">AVFoundation</text>
