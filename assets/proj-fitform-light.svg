<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="FitForm: Real-time squat form checker. Apple Vision pose estimation, joint-angle analysis and a rep-counting state machine, with voice and haptic coaching.">
<title>FitForm</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="2" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#0891b2"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<style>.st{opacity:0;animation:in .7s ease-out forwards}@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
